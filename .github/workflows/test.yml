name: test
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: ShellCheck developer and rig scripts
        run: |
          shellcheck --version
          shellcheck --severity=warning scripts/*.sh .githooks/pre-push
