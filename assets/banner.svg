<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Capture Conveyor</title>
  <desc id="desc">A keyboard-first local screenshot inbox with capture, OCR selection, copy path, and reveal controls</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131f"/>
      <stop offset="1" stop-color="#18263a"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7c8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <path d="M0 318H1280" stroke="#27354c" stroke-width="2"/>
  <g transform="translate(62 52)">
    <rect x="0" y="0" width="384" height="252" rx="18" fill="#111625" stroke="#405473" stroke-width="2"/>
    <text x="24" y="34" fill="#f4f5fa" font-family="monospace" font-size="16" font-weight="700">4 RECENT CAPTURES</text>
    <text x="324" y="34" fill="#6ee7c8" font-family="monospace" font-size="12">LOCAL</text>
    <g font-family="monospace" font-size="13">
      <rect x="20" y="54" width="344" height="36" rx="7" fill="#1b2638" stroke="#6ee7c8"/>
      <text x="36" y="77" fill="#f4f5fa">screenshot-launch-ready.png</text>
      <rect x="20" y="98" width="344" height="36" rx="7" fill="#171d2d" stroke="#33445f"/>
      <text x="36" y="121" fill="#aeb9cf">screenshot-review-notes.png</text>
      <rect x="20" y="142" width="344" height="36" rx="7" fill="#171d2d" stroke="#33445f"/>
      <text x="36" y="165" fill="#aeb9cf">screenshot-docs-polish.png</text>
    </g>
    <path d="M34 202H350" stroke="url(#belt)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="72" cy="202" r="9" fill="#10131f" stroke="#6ee7c8" stroke-width="3"/>
    <circle cx="192" cy="202" r="9" fill="#10131f" stroke="#7dd3fc" stroke-width="3"/>
    <circle cx="312" cy="202" r="9" fill="#10131f" stroke="#c084fc" stroke-width="3"/>
    <text x="22" y="233" fill="#6ee7c8" font-family="monospace" font-size="12">N NEW</text>
    <text x="132" y="233" fill="#7dd3fc" font-family="monospace" font-size="12">C COPY PATH</text>
    <text x="274" y="233" fill="#c084fc" font-family="monospace" font-size="12">O OCR</text>
  </g>
  <g transform="translate(500 72)">
    <text x="0" y="58" fill="#f4f5fa" font-family="monospace" font-size="54" font-weight="700" letter-spacing="3">CAPTURE CONVEYOR</text>
    <text x="4" y="108" fill="#aeb9cf" font-family="monospace" font-size="22" letter-spacing="2">YOUR SCREENSHOTS, READY FOR THE NEXT MOVE</text>
    <g transform="translate(4 142)" font-family="monospace" font-size="15" font-weight="700">
      <rect width="158" height="42" rx="8" fill="#18312f" stroke="#6ee7c8"/>
      <text x="26" y="27" fill="#6ee7c8">NEW CAPTURE</text>
      <rect x="172" width="148" height="42" rx="8" fill="#272039" stroke="#c084fc"/>
      <text x="196" y="27" fill="#c084fc">OCR SELECT</text>
      <rect x="334" width="132" height="42" rx="8" fill="#18263a" stroke="#7dd3fc"/>
      <text x="360" y="27" fill="#7dd3fc">COPY PATH</text>
      <rect x="480" width="144" height="42" rx="8" fill="#1b2130" stroke="#aeb9cf"/>
      <text x="502" y="27" fill="#d9deea">REVEAL</text>
    </g>
    <text x="4" y="218" fill="#74839c" font-family="monospace" font-size="14">24 ITEMS MAX  /  20 SECOND REFRESH  /  ZERO NETWORK</text>
  </g>
</svg>
